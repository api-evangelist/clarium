aid: clarium
name: Clarium
description: 'Clarium is a healthcare supply chain resiliency company founded in early 2020 during the
  COVID-19 pandemic and headquartered in New York City. Its AI-powered platform, Astra OS, unifies
  real-time data from hospitals and their suppliers across systems of record, then layers data-enabled
  workflow apps on top: Disruption Monitoring to detect and resolve supply chain disruptions faster,
  Substitute Management to automate product approvals, and Procedure Card Optimization to standardize
  and cut cost. Clarium has raised $43M+ (including a $27M Series A led by General Catalyst, with
  Northzone among its backers) and works with leading health systems such as Mount Sinai, Ochsner
  Health, Allina Health, and Yale New Haven.'
